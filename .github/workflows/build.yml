name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_description:
        description: 'App ka description likhein (e.g. Flashlight app)'
        required: true
        default: 'Simple Calculator app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install groq

    - name: Run AI Builder
      run: python builder.py "${{ github.event.inputs.app_description }}"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
